feature: Поддержка storybook
code: storybook
description: Обогащение модели данными из индекса историй storybook

specs-unit:
  Идентификатор ФТ:
    - assert: Идентификатор ФТ собирается из перечисленных в keys сегментов, в указанном порядке

    - assert: Для сегмента, заданного через символ собаки, подставляется код значения атрибута фичи

    - assert: Для сегмента, заданного через символ доллара, подставляется название значения атрибута фичи

    - assert: Если у фичи несколько значений атрибута, указанного в keys, история с ней не сопоставляется

    - assert: Если у фичи не проставлен атрибут, указанный в keys, история с ней не сопоставляется

  Разбор индекса:
    - assert: Полное имя истории собирается из title, разбитого по косой черте, и name

    - assert: Написанная история делает ФТ автоматизированным
      description: У историй нет статуса выполнения, поэтому наличия истории достаточно

  Ссылка на историю:
    - assert: Если в настройках указан publicUrl, у сопоставленного ФТ появляется ссылка на историю

    - assert: Если publicUrl не указан, ссылка у ФТ не проставляется

  Сопоставленные тесты:
    - assert: История, полное имя которой совпало с идентификатором ФТ, добавляется в модель как сопоставленная с этим ФТ

    - assert: Несколько историй с одинаковым полным именем дают ФТ несколько сопоставленных тестов

    - assert: Если идентификаторы двух ФТ совпадают, история сопоставляется с обоими

    - assert: История, не сопоставленная ни с одним ФТ, попадает в отчет как история без описания

    - assert: Несколько историй с одинаковым полным именем, не сопоставленных ни с одним ФТ, дают в отчете одну запись
