feature: Валидация
code: validation
description: Проверка спецификаций проекта и их соответствия автотестам при запуске команд validate и sync

specs-unit:
  Дубликаты тестов:
    - assert: Если с одним ФТ сопоставлено два и более теста, валидация сообщает о дубликате
      description: Тип ошибки — assertion-duplicate-test

    - assert: Если с ФТ сопоставлен ровно один тест, дубликат не регистрируется

    - assert: Тесты из разных источников учитываются вместе, поэтому jest-тест и история storybook с одинаковым идентификатором образуют дубликат

    - assert: В сообщении об ошибке перечислены все сопоставленные тесты с указанием источника, полного имени и пути к файлу

  ФТ без тестов:
    - assert: Если с ФТ не сопоставлено ни одного теста, валидация сообщает о непокрытом ФТ
      description: Тип ошибки — assertion-not-covered

    - assert: Если с ФТ сопоставлен хотя бы один тест, непокрытое ФТ не регистрируется

    - assert: Тест со статусом skipped или pending считается покрытием
      description: Такой тест выставляет ФТ признак automationState = Problem, но ФТ остается покрытым

    - assert: Если в конфиге не подключен ни один источник тестов, о непокрытии сообщается для всех ФТ проекта

    - assert: В сообщении об ошибке указаны название ФТ, название группы и путь к yml файлу

  Тесты без описания:
    - assert: Тест, сопоставленный с ФТ, не попадает в отчет как тест без описания

    - assert: Если с одним ФТ сопоставлено несколько тестов, ни один из них не попадает в отчет как тест без описания

  Уровни правил:
    - assert: По умолчанию дубликат тестов регистрируется как предупреждение

    - assert: По умолчанию проверка непокрытых ФТ выключена и в отчет не попадает

    - assert: Уровень каждого правила переопределяется в секции validation конфигурационного файла

    - assert: Правило с уровнем error прерывает выполнение команды
