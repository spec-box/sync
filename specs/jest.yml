feature: Поддержка jest
code: jest
description: Обогащение модели данными из json отчета jest

specs-unit:
  Идентификатор ФТ:
    - assert: Идентификатор ФТ собирается из перечисленных в keys сегментов, в указанном порядке

    - assert: Для сегмента, заданного через символ собаки, подставляется код значения атрибута фичи

    - assert: Для сегмента, заданного через символ доллара, подставляется название значения атрибута фичи

    - assert: Если у фичи несколько значений атрибута, указанного в keys, тест с ней не сопоставляется

    - assert: Если у фичи не проставлен атрибут, указанный в keys, тест с ней не сопоставляется

  Разбор отчета:
    - assert: Полное имя теста собирается из ancestorTitles и title

    - assert: Тест со статусом passed или failed делает ФТ автоматизированным

    - assert: Тест со статусом pending или skipped помечает ФТ как проблемный

  Сопоставленные тесты:
    - assert: Тест, полное имя которого совпало с идентификатором ФТ, добавляется в модель как сопоставленный с этим ФТ

    - assert: Два теста с одинаковым полным именем из разных файлов дают ФТ два сопоставленных теста

    - assert: Тест, не сопоставленный ни с одним ФТ, попадает в отчет как тест без описания
